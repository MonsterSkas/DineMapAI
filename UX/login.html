<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In · DineMapAI</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon"><i class="fa-solid fa-map-location-dot"></i></div>
        <div>
          <h1>Dine<span style="color: var(--accent-purple-light)">Map</span>AI</h1>
          <p>Restaurant Location Intelligence</p>
        </div>
      </div>

      <!-- The id on this form is used by js/login.js to attach the submit handler -->
      <form id="loginForm" class="auth-form" novalidate>
        <div class="field">
          <label for="username"><i class="fa-solid fa-user"></i> Username or email</label>
          <input
            type="text"
            id="username"
            class="input-control"
            placeholder="Enter your username or email"
            autocomplete="username"
          />
        </div>

        <div class="field">
          <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <input
            type="password"
            id="password"
            class="input-control"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
        </div>

        <div class="checkbox-row">
          <label><input type="checkbox" id="rememberMe" /> Remember me</label>
          <a href="#" class="btn-ghost">Forgot password?</a>
        </div>

        <div id="formMessage" class="form-message"></div>

        <button type="submit" id="loginButton" class="btn btn-primary btn-block">
          Log In
        </button>
      </form>

      <p class="auth-footer-text">
        Don't have an account? <a href="#">Contact your team admin</a>
      </p>
    </div>
  </div>

  <!-- api.js must load before login.js because login.js calls loginUser() -->
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
